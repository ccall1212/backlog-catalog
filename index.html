<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog Catalog</title>
<style>
:root{
  --bg:#0f1420;--panel:#171d2b;--panel2:#1e2535;--side:#0c111c;--line:#2a3346;--text:#e7ebf3;--muted:#8b95a9;
  --accent:#6366f1;--accent2:#4f46e5;--hot-bg:#3a2f12;--hot-text:#ffd470;--green:#34d399;--red:#f87171;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
.layout{display:flex;height:100vh}
.sidebar{width:222px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.sidebar .brand{font-size:18px;font-weight:700;padding:18px 16px 12px}
.nav{display:flex;flex-direction:column;padding:4px 8px;gap:2px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.nav-item.open{color:var(--text)}
.nav-item .chev{font-size:10px;color:var(--muted)}
.nav-item.active .chev{color:#fff}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:1px 8px;font-weight:600}
.nav-item.active .cnt{color:#fff;background:rgba(255,255,255,.22)}
.nav-sub{display:flex;flex-direction:column;gap:2px}
.nav-item.sub{padding-left:32px;font-size:13px}
.side-foot{margin-top:auto;padding:14px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.content{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 22px 2px}
.view-title{font-size:20px;font-weight:700}
.spacer{flex:1}
.saved{color:var(--green);opacity:0;transition:opacity .2s;font-size:12px}
.saved.show{opacity:1}
.toolbar{flex-shrink:0;display:flex;gap:10px;align-items:center;padding:12px 22px;flex-wrap:wrap}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled{cursor:not-allowed}
#search{min-width:200px;flex:0 1 300px}
.sortwrap label{color:var(--muted);display:flex;gap:6px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
main{flex:1;min-height:0;overflow:auto;padding:6px 22px 24px}
.tablewrap{border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:1040px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;z-index:2}
tbody tr:hover{background:var(--panel)}
td.center,th.center{text-align:center}
td.title{font-weight:600;max-width:280px}
td.comments{color:var(--muted);max-width:280px}
td.plat{white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#33415533;color:#cdd6e6;margin:1px 2px 1px 0}
.p-pc{background:#d4d8e0;color:#1b2230}
.p-xbox{background:#14532d55;color:#86efac}
.p-ps{background:#3730a355;color:#a5b4fc}
.p-nin{background:#7f1d1d55;color:#fca5a5}
.muted{color:var(--muted)}
.na{color:var(--muted);text-decoration:line-through}
.mp-no{color:var(--red);font-size:16px;line-height:1}
.mp-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle;letter-spacing:.05em}
.chk{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:700;width:30px;height:26px;border-radius:7px;line-height:1}
.chk:hover{background:var(--panel2);border-color:var(--accent);color:var(--green)}
.chk.on{color:var(--green)}
.hot{background:var(--hot-bg);color:var(--hot-text);font-weight:700;padding:1px 8px;border-radius:6px}
.icon{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:6px}
.icon:hover{background:var(--panel2);color:var(--text)}.icon.danger:hover{color:var(--red)}
.actions{white-space:nowrap;text-align:right}
.empty{padding:40px;text-align:center;color:var(--muted)}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-weight:700;letter-spacing:.03em;margin:16px 0 8px}
.grp-head:first-child{margin-top:4px}
.grp-head .count{margin-left:auto;background:var(--panel2);color:var(--muted);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;min-width:124px}
.cval{font-size:26px;font-weight:700}.clab{color:var(--muted);font-size:12px;margin-top:2px}
h3{color:var(--muted);font-weight:600;margin:18px 0 8px}
footer{flex-shrink:0;color:var(--muted);font-size:12px;padding:12px 22px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(4,7,14,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:560px}
.dialog h2{margin:0 0 16px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}
.grid label.full{grid-column:1/-1}
.hint{font-weight:400;color:var(--muted);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-family:inherit}
.pchip:hover{border-color:var(--accent);color:var(--text)}
.pchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pchip.add{border-style:dashed}
input.err{border-color:var(--red)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:700px){
  .layout{flex-direction:column;height:100vh}
  .sidebar{width:auto;border-right:none;border-bottom:1px solid var(--line);overflow:visible}
  .nav{flex-flow:row wrap}.nav-sub{flex-flow:row wrap}
  .nav-item{width:auto}.nav-item.sub{padding-left:12px}
  .side-foot{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">&#127918; Backlog Catalog</div>
    <nav class="nav">
      <button class="nav-item" data-view="all">All Games <span class="cnt" id="cnt-all"></span></button>
      <button class="nav-item parent" data-view="backlog"><span class="chev">&#9662;</span> Backlog</button>
      <div class="nav-sub">
        <button class="nav-item sub" data-view="bl-nf">Not Finished <span class="cnt" id="cnt-nf"></span></button>
        <button class="nav-item sub" data-view="bl-fin">Finished <span class="cnt" id="cnt-fin"></span></button>
        <button class="nav-item sub" data-view="bl-want">Want to 100% <span class="cnt" id="cnt-want"></span></button>
      </div>
      <button class="nav-item" data-view="stats">Stats</button>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div class="view-title" id="viewTitle"></div>
      <div class="spacer"></div>
      <span id="savedNote" class="saved">Saved &#10003;</span>
    </div>
    <div id="toolbar" class="toolbar">
      <input id="search" type="search" placeholder="Search games or comments&#8230;">
      <select id="platform"></select>
      <span class="sortwrap"><label>Sort
        <select id="sort">
          <option value="title">Title A&#8211;Z</option>
          <option value="want">Want to Play (high to low)</option>
          <option value="final">Final Rating (high to low)</option>
          <option value="platform">Platform</option>
        </select></label></span>
      <div class="spacer"></div>
      <button id="addBtn" class="btn primary">+ Add game</button>
      <button id="exportJson" class="btn">Export JSON</button>
      <button id="exportCsv" class="btn">Export CSV</button>
      <button id="importBtn" class="btn">Import</button>
    </div>
    <main id="main"></main>
    <footer>Tip: click the &#8211; under <b>Finished</b> or <b>Started/Played</b> to toggle it. Auto-saves in this browser &#8212; use <b>Export JSON</b> for a backup.</footer>
  </div>
</div>

<div id="modal" class="modal">
  <div class="dialog">
    <h2 id="mTitleHdr">Add game</h2>
    <div class="grid">
      <label class="full">Game<input id="mGame" type="text" autocomplete="off"></label>
      <label class="full">Platform(s) <span class="hint">click to select</span><div id="mPlats" class="chips"></div></label>
      <label class="full">Multiplayer only? <span class="hint">crosses out Finished &amp; Started/Played</span><div style="margin-top:5px"><button type="button" id="mMpBtn" class="pchip">Multiplayer only</button></div></label>
      <label>Finished?<input id="mFin" type="text" list="ynList" autocomplete="off"></label>
      <label>Started / Played?<input id="mStarted" type="text" list="ynList" autocomplete="off"></label>
      <label>Want to Play (1&#8211;10)<input id="mWantR" type="number" min="0" max="10" step="0.5"></label>
      <label>Final Rating (1&#8211;10) <span class="hint">needs Started/Played</span><input id="mFinal" type="number" min="0" max="10" step="0.5"></label>
      <label>Want to 100%?<input id="mWant" type="text" list="ynList" autocomplete="off"></label>
      <label>100% Complete?<input id="mDone" type="text" list="ynList" autocomplete="off"></label>
      <label>Replayable?<input id="mReplay" type="text" list="ynList" autocomplete="off"></label>
      <label class="full">Comments<textarea id="mComments" rows="2"></textarea></label>
    </div>
    <div class="dlg-actions">
      <button id="mCancel" class="btn">Cancel</button>
      <button id="mSave" class="btn primary">Save</button>
    </div>
  </div>
</div>
<datalist id="ynList"><option value="Yes"></option><option value="No"></option><option value="N/A"></option></datalist>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script>
const SEED = [];
const LS_KEY = 'gamesLibrary.v1';
const PLATFORMS = ['PC','Xbox','PlayStation','Nintendo'];
const PRANK = {PC:0,Xbox:1,PlayStation:2,Nintendo:3};
const PLAT_CLASS = {PC:'p-pc',Xbox:'p-xbox',PlayStation:'p-ps',Nintendo:'p-nin'};
const TITLE_ALIASES = {'final fantasy x (10)':'Final Fantasy X'};
const VIEW_TITLES = {all:'All Games',backlog:'Backlog','bl-nf':'Not Finished','bl-fin':'Finished','bl-want':'Want to 100%',stats:'Stats'};

function uid(){ try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'id-'+Date.now()+'-'+Math.floor(Math.random()*1e9); }
function yes(v){ return /^\s*yes/i.test(v||''); }
function num(v){ if(v===null||v===undefined||v==='') return null; const n=Number(v); return isNaN(n)?null:n; }
function wantNum(g){ return num(g.want); }
function finalNum(g){ return num(g.final); }
function platsOf(g){ return Array.isArray(g.platforms)? g.platforms : (g.platform?[g.platform]:[]); }
function rankPlats(ps){ return ps.slice().sort((a,b)=>((PRANK[a]==null?9:PRANK[a])-(PRANK[b]==null?9:PRANK[b]))); }

function mergeDupes(arr){
  const map=new Map(), order=[];
  arr.forEach(g=>{ const k=(g.title||'').trim().toLowerCase(); if(!map.has(k)){ map.set(k,[]); order.push(k); } map.get(k).push(g); });
  const out=[];
  order.forEach(k=>{
    const grp=map.get(k);
    if(grp.length===1){ out.push(grp[0]); return; }
    const plats=[]; grp.forEach(g=>platsOf(g).forEach(p=>{ if(p && plats.indexOf(p)<0) plats.push(p); }));
    const anyYes=fld=>grp.some(g=>yes(g[fld]));
    const firstNon=fld=>{ for(const g of grp){ const v=(g[fld]==null?'':String(g[fld])).trim(); if(v) return v; } return ''; };
    const wants=grp.map(wantNum).filter(x=>x!=null), finals=grp.map(finalNum).filter(x=>x!=null);
    const comments=[]; grp.forEach(g=>{ const c=(g.comments||'').trim(); if(c && comments.indexOf(c)<0) comments.push(c); });
    const fin=anyYes('finished')?'Yes':firstNon('finished');
    out.push({ id:grp[0].id||uid(), title:grp[0].title, platforms:rankPlats(plats), mp:grp.some(g=>g.mp===true), finished:fin,
      started:(yes(fin)||anyYes('started'))?'Yes':'', want100:anyYes('want100')?'Yes':firstNon('want100'),
      done100:anyYes('done100')?'Yes':firstNon('done100'), replayable:anyYes('replayable')?'Yes':firstNon('replayable'),
      want:wants.length?Math.max.apply(null,wants):null, final:finals.length?Math.max.apply(null,finals):null, comments:comments.join(' / ') });
  });
  return out;
}
function prep(arr){
  arr.forEach(g=>{
    if(!g.id) g.id=uid();
    const al=TITLE_ALIASES[(g.title||'').trim().toLowerCase()]; if(al) g.title=al;
    if(!Array.isArray(g.platforms)) g.platforms = (g.platform!=null&&g.platform!=='')?[g.platform]:[];
    delete g.platform;
    g.mp = (g.mp===true);
    if(g.mp){ g.finished=''; g.started=''; }
    else if(g.started===undefined||g.started===null) g.started=yes(g.finished)?'Yes':'';
    // migrate legacy single `rating` -> want (anticipation) / final (verdict), split by whether played
    if(g.want===undefined && g.final===undefined && g.rating!==undefined){
      const rt=num(g.rating);
      if(yes(g.started)){ g.final=rt; g.want=null; } else { g.want=rt; g.final=null; }
    }
    if(g.want===undefined) g.want=null;
    if(g.final===undefined) g.final=null;
    delete g.rating;
    // gating: a Final Rating implies the game was played; multiplayer-only games carry no Final Rating
    if(g.mp) g.final=null;
    else if(g.final!=null && !yes(g.started) && !yes(g.finished)) g.started='Yes';
  });
  return mergeDupes(arr);
}
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)) return prep(a); } }catch(e){}
  return prep(JSON.parse(JSON.stringify(SEED)));
}
let saveTimer;
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(games)); }catch(e){ console.warn('save failed',e);} const el=document.getElementById('savedNote'); if(el){ el.classList.add('show'); clearTimeout(saveTimer); saveTimer=setTimeout(()=>el.classList.remove('show'),1200);} }

let games = load();
let view = 'all';
let filters = { search:'', platform:'all', sort:'title' };
let editingId = null;
let modalPlats = [];
let modalMp = false;

function isFinished(g){ return yes(g.finished); }
function isStarted(g){ return yes(g.started); }
function isMp(g){ return g.mp===true; }
function wants100(g){ return yes(g.want100); }
function done100(g){ return yes(g.done100); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setText(id,v){ const e=document.getElementById(id); if(e) e.textContent=v; }

function visibleGames(){
  let list = games.slice();
  const q = filters.search.trim().toLowerCase();
  if(q) list = list.filter(g => (g.title||'').toLowerCase().includes(q) || (g.comments||'').toLowerCase().includes(q));
  if(filters.platform!=='all') list = list.filter(g => platsOf(g).indexOf(filters.platform)>=0);
  const s = filters.sort;
  list.sort((a,b)=>{
    if(s==='want'){ const ra=wantNum(a), rb=wantNum(b); return (rb==null?-1:rb)-(ra==null?-1:ra) || (a.title||'').localeCompare(b.title||''); }
    if(s==='final'){ const ra=finalNum(a), rb=finalNum(b); return (rb==null?-1:rb)-(ra==null?-1:ra) || (a.title||'').localeCompare(b.title||''); }
    if(s==='platform'){ return (platsOf(a)[0]||'').localeCompare(platsOf(b)[0]||'') || (a.title||'').localeCompare(b.title||''); }
    return (a.title||'').localeCompare(b.title||'');
  });
  return list;
}
function badges(g){ return platsOf(g).map(p=>'<span class="badge '+(PLAT_CLASS[p]||'')+'">'+esc(p)+'</span>').join(''); }
function rateCell(n){ return (n!=null) ? ((n>7)?'<span class="hot">'+n+'</span>': String(n)) : ''; }
function toggleCell(g,field){
  const on=yes(g[field]);
  const tip = field==='finished' ? (on?'Finished — click to undo':'Click to mark finished') : (on?'Played — click to clear':'Click to mark started/played');
  return '<button class="chk'+(on?' on':'')+'" data-act="tog" data-field="'+field+'" data-id="'+g.id+'" title="'+tip+'">'+(on?'&#10003;':'&#8211;')+'</button>';
}
function statusCell(g,field){ if(isMp(g)) return '<span class="mp-no" title="Multiplayer only — N/A">&#8856;</span>'; return toggleCell(g,field); }
function gameRow(g){
  return '<tr data-id="'+g.id+'">'
    +'<td class="title">'+esc(g.title)+(isMp(g)?' <span class="mp-tag">MP</span>':'')+'</td>'
    +'<td class="plat">'+badges(g)+'</td>'
    +'<td class="center">'+statusCell(g,'finished')+'</td>'
    +'<td class="center">'+statusCell(g,'started')+'</td>'
    +'<td class="center">'+esc(g.want100||'')+'</td>'
    +'<td class="center">'+esc(g.done100||'')+'</td>'
    +'<td class="center">'+esc(g.replayable||'')+'</td>'
    +'<td class="center">'+rateCell(wantNum(g))+'</td>'
    +'<td class="center">'+rateCell(finalNum(g))+'</td>'
    +'<td class="comments">'+esc(g.comments||'')+'</td>'
    +'<td class="actions"><button class="icon" data-act="edit" data-id="'+g.id+'" title="Edit">&#9998;</button>'
    +'<button class="icon danger" data-act="del" data-id="'+g.id+'" title="Delete">&#128465;</button></td>'
    +'</tr>';
}
function tableHtml(list){
  if(!list.length) return '<div class="empty">Nothing here yet. Click <b>+ Add game</b> to start.</div>';
  return '<div class="tablewrap"><table><thead><tr>'
    +'<th>Game</th><th>Platform</th><th class="center">Finished</th><th class="center">Started/Played</th><th class="center">Want 100%</th><th class="center">100%?</th><th class="center">Replay</th><th class="center">Want to Play</th><th class="center">Final Rating</th><th>Comments</th><th></th>'
    +'</tr></thead><tbody>'+list.map(gameRow).join('')+'</tbody></table></div>';
}
function grp(label,arr){ return '<div class="grp-head">'+label+' <span class="count">'+arr.length+'</span></div>'+tableHtml(arr); }
function statCard(label,val){ return '<div class="card"><div class="cval">'+val+'</div><div class="clab">'+label+'</div></div>'; }
function avgOf(arr,key){ const r=arr.map(g=>num(g[key])).filter(x=>x!=null); return r.length? (r.reduce((s,x)=>s+x,0)/r.length): null; }
function statsHtml(){
  const total=games.length, fin=games.filter(isFinished).length, done=games.filter(done100).length, want=games.filter(wants100).length;
  const mp=games.filter(isMp).length;
  const notfin=games.filter(g=>!isFinished(g)&&!isMp(g)).length;
  const playing=games.filter(g=>isStarted(g)&&!isFinished(g)&&!isMp(g)).length;
  const avgW=avgOf(games,'want'), avgF=avgOf(games,'final');
  const extra=Array.from(new Set([].concat.apply([],games.map(platsOf)).filter(p=>p&&PLATFORMS.indexOf(p)<0)));
  let rows='';
  PLATFORMS.concat(extra).forEach(p=>{ const gs=games.filter(g=>platsOf(g).indexOf(p)>=0); if(!gs.length) return; const a=avgOf(gs,'final');
    rows+='<tr><td><span class="badge '+(PLAT_CLASS[p]||'')+'">'+esc(p)+'</span></td><td class="center">'+gs.length+'</td><td class="center">'+gs.filter(isFinished).length+'</td><td class="center">'+gs.filter(done100).length+'</td><td class="center">'+(a!=null?a.toFixed(1):'&#8211;')+'</td></tr>'; });
  return '<div class="cards">'+statCard('Total games',total)+statCard('Finished',fin)+statCard('Playing now',playing)+statCard('Not finished',notfin)+statCard('Multiplayer',mp)+statCard('100% complete',done)+statCard('Want to 100%',want)+statCard('Avg want-to-play',avgW!=null?avgW.toFixed(1):'&#8211;')+statCard('Avg final rating',avgF!=null?avgF.toFixed(1):'&#8211;')+'</div>'
    +'<h3>By platform</h3><div class="tablewrap"><table><thead><tr><th>Platform</th><th class="center">Games</th><th class="center">Finished</th><th class="center">100%</th><th class="center">Avg final</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function render(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active','open'));
  const cur=document.querySelector('.nav-item[data-view="'+view+'"]'); if(cur) cur.classList.add('active');
  if(view==='bl-nf'||view==='bl-fin'||view==='bl-want'){ const p=document.querySelector('.nav-item.parent'); if(p) p.classList.add('open'); }
  const base=visibleGames();
  const nf=base.filter(g=>!isFinished(g)&&!isMp(g)), fin=base.filter(isFinished), want=base.filter(wants100);
  setText('cnt-all', base.length); setText('cnt-nf', nf.length); setText('cnt-fin', fin.length); setText('cnt-want', want.length);
  setText('viewTitle', VIEW_TITLES[view]||'');
  setText('sideFoot', games.length+' games · '+games.filter(isFinished).length+' finished');
  document.getElementById('toolbar').style.display=(view==='stats')?'none':'flex';
  const main=document.getElementById('main');
  if(view==='stats'){ main.innerHTML=statsHtml(); }
  else if(view==='all'){ main.innerHTML=tableHtml(base); }
  else if(view==='backlog'){ main.innerHTML=grp('NOT FINISHED',nf)+grp('FINISHED',fin)+grp('WANT TO 100% &#8212; go back &amp; 100%',want); }
  else if(view==='bl-nf'){ main.innerHTML=tableHtml(nf); }
  else if(view==='bl-fin'){ main.innerHTML=tableHtml(fin); }
  else if(view==='bl-want'){ main.innerHTML=tableHtml(want); }
}
function buildPlatformOptions(){
  const all = Array.from(new Set(PLATFORMS.concat([].concat.apply([],games.map(platsOf)).filter(Boolean))));
  document.getElementById('platform').innerHTML = '<option value="all">All platforms</option>'+all.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
}

function f(id){ return document.getElementById(id); }
function platChoices(){ return Array.from(new Set(PLATFORMS.concat([].concat.apply([],games.map(platsOf)).filter(Boolean)).concat(modalPlats))); }
function renderPlatChips(){
  const wrap=document.getElementById('mPlats'); if(!wrap) return;
  wrap.innerHTML = platChoices().map(p=>'<button type="button" class="pchip'+(modalPlats.indexOf(p)>=0?' on':'')+'" data-plat="'+esc(p)+'">'+esc(p)+'</button>').join('')+'<button type="button" class="pchip add" id="addPlatChip">+ New</button>';
}
function updateFinalState(){
  const ok = (yes(f('mStarted').value) || yes(f('mFin').value)) && !modalMp;
  const el=f('mFinal'); if(el){ el.disabled=!ok; el.style.opacity=ok?'1':'0.45'; if(!ok) el.value=''; }
}
function updateMpUI(){
  const btn=document.getElementById('mMpBtn'); if(btn) btn.classList.toggle('on', modalMp);
  ['mFin','mStarted'].forEach(id=>{ const el=f(id); if(el){ el.disabled=modalMp; el.style.opacity=modalMp?'0.45':'1'; if(modalMp) el.value=''; } });
  updateFinalState();
}
function openModal(id){
  editingId=id;
  const g = id? games.find(x=>x.id===id) : {title:'',platforms:(filters.platform!=='all'?[filters.platform]:['PC']),mp:false,finished:'',started:'',want100:'',done100:'',replayable:'',want:null,final:null,comments:''};
  f('mTitleHdr').textContent = id?'Edit game':'Add game';
  f('mGame').value=g.title||''; f('mGame').classList.remove('err');
  modalPlats=platsOf(g).slice(); renderPlatChips();
  modalMp = g.mp===true;
  f('mFin').value=g.finished||''; f('mStarted').value=g.started||'';
  f('mWant').value=g.want100||''; f('mDone').value=g.done100||''; f('mReplay').value=g.replayable||'';
  f('mWantR').value=(g.want===0||g.want)?g.want:''; f('mFinal').value=(g.final===0||g.final)?g.final:'';
  f('mComments').value=g.comments||'';
  updateMpUI();
  document.getElementById('modal').classList.add('show'); f('mGame').focus();
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); editingId=null; }
function saveModal(){
  const title=f('mGame').value.trim();
  if(!title){ f('mGame').classList.add('err'); f('mGame').focus(); return; }
  const platforms=modalPlats.slice();
  const want=num(f('mWantR').value);
  const startedYes = (yes(f('mStarted').value) || yes(f('mFin').value)) && !modalMp;
  const final = startedYes ? num(f('mFinal').value) : null;
  const data={ title, platforms:rankPlats(platforms), mp:modalMp, finished:f('mFin').value.trim(), started:f('mStarted').value.trim(), want100:f('mWant').value.trim(), done100:f('mDone').value.trim(), replayable:f('mReplay').value.trim(), want, final, comments:f('mComments').value.trim() };
  if(modalMp){ data.finished=''; data.started=''; data.final=null; }
  else if(yes(data.finished) && !data.started) data.started='Yes';
  if(editingId){ const t=games.find(x=>x.id===editingId); delete t.platform; delete t.rating; Object.assign(t, data); }
  else { data.id=uid(); games.push(data); }
  save(); closeModal(); buildPlatformOptions(); render();
}
function del(id){ const g=games.find(x=>x.id===id); if(!g) return; if(confirm('Delete "'+g.title+'"? This can\'t be undone (Export a backup first if unsure).')){ games=games.filter(x=>x.id!==id); save(); render(); } }
function toggleField(id,field){
  const g=games.find(x=>x.id===id); if(!g || isMp(g)) return;
  const on=yes(g[field]); g[field]= on?'No':'Yes';
  if(field==='finished' && !on) g.started='Yes';
  save(); render();
}

function download(name,text,type){ const b=new Blob([text],{type:type||'application/octet-stream'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function stripId(g){ const o={}; for(const k in g){ if(k!=='id'&&k!=='platform'&&k!=='rating') o[k]=g[k]; } return o; }
function exportJSON(){ download('games-library-backup.json', JSON.stringify(games.map(stripId),null,2), 'application/json'); }
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCSV(){
  const head=['Game','Platform(s)','Multiplayer only?','Finished?','Started/Played?','Want to 100%?','100% Complete?','Replayable?','Want to Play (1-10)','Final Rating (1-10)','Comments'];
  const lines=[head.map(csvCell).join(',')];
  games.forEach(g=>{ lines.push([g.title, platsOf(g).join('; '), (g.mp?'Yes':''), g.finished, g.started, g.want100, g.done100, g.replayable, g.want, g.final, g.comments].map(csvCell).join(',')); });
  download('games.csv', lines.join('\r\n'), 'text/csv');
}
function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{ try{ const a=JSON.parse(reader.result); if(!Array.isArray(a)) throw new Error('File is not a games list'); if(confirm('Import '+a.length+' games? This replaces your current '+games.length+'.')){ games=prep(a.map(x=>Object.assign({title:'',platforms:[],mp:false,finished:'',started:'',want100:'',done100:'',replayable:'',want:null,final:null,comments:''},x))); save(); view='all'; buildPlatformOptions(); render(); } }catch(err){ alert('Could not import: '+err.message); } e.target.value=''; };
  reader.readAsText(file);
}
function onMainClick(e){
  const btn=e.target.closest('button[data-act]'); if(!btn) return;
  const act=btn.dataset.act;
  if(act==='tog') toggleField(btn.dataset.id, btn.dataset.field);
  else if(act==='edit') openModal(btn.dataset.id);
  else if(act==='del') del(btn.dataset.id);
}
function bind(){
  document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>{ view=n.dataset.view; render(); }));
  f('search').addEventListener('input',e=>{ filters.search=e.target.value; render(); });
  f('platform').addEventListener('change',e=>{ filters.platform=e.target.value; render(); });
  f('sort').addEventListener('change',e=>{ filters.sort=e.target.value; render(); });
  f('addBtn').addEventListener('click',()=>openModal(null));
  f('exportJson').addEventListener('click',exportJSON);
  f('exportCsv').addEventListener('click',exportCSV);
  f('importBtn').addEventListener('click',()=>f('importFile').click());
  f('importFile').addEventListener('change',importJSON);
  f('main').addEventListener('click',onMainClick);
  f('mCancel').addEventListener('click',closeModal);
  f('mSave').addEventListener('click',saveModal);
  f('mMpBtn').addEventListener('click',()=>{ modalMp=!modalMp; updateMpUI(); });
  f('mStarted').addEventListener('input',updateFinalState);
  f('mFin').addEventListener('input',updateFinalState);
  document.getElementById('mPlats').addEventListener('click',e=>{
    const add=e.target.closest('#addPlatChip');
    if(add){ const name=(prompt('New platform name:')||'').trim(); if(name && modalPlats.indexOf(name)<0) modalPlats.push(name); renderPlatChips(); return; }
    const chip=e.target.closest('.pchip[data-plat]'); if(!chip) return;
    const p=chip.dataset.plat; const i=modalPlats.indexOf(p); if(i>=0) modalPlats.splice(i,1); else modalPlats.push(p); renderPlatChips();
  });
  document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
}
buildPlatformOptions(); bind(); render();
</script>
</body>
</html>
